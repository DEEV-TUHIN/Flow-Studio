<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Google Flow</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            flowBg: '#000000',
            flowSidebar: '#09090b',
            flowCard: '#111114',
            flowBorder: '#1f1f24',
            flowHover: '#1a1a20',
            flowActive: '#24242e'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }

    @keyframes flowPulse {
      0%, 100% {
        border-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.04);
      }
      50% {
        border-color: rgba(96, 165, 250, 0.45);
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.25);
      }
    }
    .flow-glow-active { animation: flowPulse 2.8s ease-in-out infinite; }
  </style>
</head>
<body class="bg-flowBg text-zinc-200 min-h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- LOGIN -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-flowCard border border-flowBorder p-8 rounded-2xl shadow-2xl flex flex-col items-center">
      <div class="flex items-center space-x-2.5 mb-2">
        <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center border border-zinc-700">
          <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
        </div>
        <span class="text-xl font-semibold tracking-wide text-white">Google Flow</span>
      </div>
      <p class="text-xs text-zinc-400 mb-6 text-center">Login with your assigned credentials</p>

      <form id="login-form" class="w-full space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Gmail / Email</label>
          <input type="email" id="login-email" required placeholder="client@gmail.com"
            class="w-full bg-[#0a0a0c] border border-flowBorder rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••"
            class="w-full bg-[#0a0a0c] border border-flowBorder rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-zinc-500">
        </div>

        <div id="login-error" class="hidden text-xs text-red-400 bg-red-950/40 p-2.5 rounded-lg text-center"></div>

        <button type="submit" class="w-full py-2.5 bg-white text-black font-semibold text-sm rounded-xl hover:bg-zinc-200 transition">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden flex-1 flex w-full h-screen overflow-hidden">
    <aside class="w-60 border-r border-flowBorder bg-flowSidebar flex flex-col justify-between p-3.5">
      <div class="space-y-5">
        <div class="flex items-center space-x-2 px-2 pt-1 text-white">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span class="text-xs font-medium">Google Flow Pro</span>
        </div>
        <nav class="space-y-1">
          <button class="w-full flex items-center space-x-3 px-3 py-2 rounded-xl bg-flowActive text-white text-xs font-medium">
            <i data-lucide="play-square" class="w-4 h-4 text-blue-400"></i>
            <span>Studio Canvas</span>
          </button>
        </nav>
      </div>

      <div class="pt-3 border-t border-flowBorder/60">
        <div id="user-display-email" class="text-[11px] text-zinc-500 truncate px-2 mb-2"></div>
        <button id="logout-btn" class="w-full flex items-center space-x-2 px-3 py-2 rounded-xl text-red-400 hover:bg-zinc-900 text-xs transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-flowBg relative min-w-0">
      <header class="h-14 border-b border-flowBorder px-6 flex items-center justify-between">
        <div class="text-xs text-zinc-400">Personal Google Pro Workspace</div>
        <div class="px-2.5 py-1 rounded-md bg-[#18181b] text-zinc-300 text-[10px] font-semibold border border-zinc-800">
          PRO ULTRA
        </div>
      </header>

      <!-- CANVAS -->
      <section class="flex-1 flex flex-col items-center justify-center p-6 relative overflow-y-auto">
        <div id="dropzone" class="flex flex-col items-center justify-center space-y-4 text-center">
          <div class="w-14 h-14 flex items-center justify-center text-zinc-400 opacity-90">
            <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 14a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2zm8-6a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2 2 2 0 0 1 2-2h2zm-14 0a2 2 0 0 1 2 2 2 2 0 0 1-2 2H4a2 2 0 0 1-2-2 2 2 0 0 1 2-2h2zm11.657-4.243a2 2 0 0 1 0 2.828l-1.414 1.415a2 2 0 0 1-2.829-2.829l1.415-1.414a2 2 0 0 1 2.828 0zm-11.314 11.314a2 2 0 0 1 0 2.829l-1.414 1.414a2 2 0 0 1-2.829-2.828l1.415-1.415a2 2 0 0 1 2.828 0zm11.314 0a2 2 0 0 1 2.828 0l1.415 1.415a2 2 0 0 1-2.829 2.828l-1.414-1.414a2 2 0 0 1 0-2.829zm-11.314-11.314a2 2 0 0 1 2.829 0l1.414 1.414a2 2 0 0 1-2.828 2.829l-1.415-1.415a2 2 0 0 1 0-2.828zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
          </div>
          <p class="text-sm font-light text-zinc-300">Start creating or drop media</p>
        </div>

        <!-- RESULT VIEW -->
        <div id="result-view" class="hidden w-full max-w-2xl flex flex-col items-center space-y-4">
          <div id="output-box" class="w-full aspect-video bg-flowCard rounded-2xl border border-flowBorder overflow-hidden relative flex flex-col items-center justify-center p-4">
            <video id="output-video" controls autoplay loop playsinline class="w-full h-full object-contain hidden rounded-xl"></video>

            <div id="loading-spinner" class="hidden flex flex-col items-center space-y-4 text-center px-4">
              <div class="w-12 h-12 rounded-full bg-zinc-900 border border-blue-500/50 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i data-lucide="sparkles" class="w-5 h-5 text-blue-400 animate-pulse"></i>
              </div>
              <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-300">
                <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                <span id="router-feedback-status" class="font-mono">Assigning task to Google worker...</span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between w-full px-2">
            <div id="output-prompt-text" class="text-xs text-zinc-400 italic max-w-md truncate"></div>
            <a id="download-btn" href="#" target="_blank" download="google-flow-video.mp4" 
              class="hidden px-3.5 py-1.5 rounded-xl bg-white text-xs text-black font-semibold items-center space-x-1.5 transition">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span>Download Video</span>
            </a>
          </div>
        </div>
      </section>

      <!-- PROMPT BAR -->
      <footer class="w-full flex flex-col items-center pb-4 px-6 z-20">
        <div class="w-full max-w-2xl bg-[#141417] border border-flowBorder rounded-2xl p-2.5 shadow-2xl flex flex-col space-y-2">
          <textarea id="prompt-input" rows="1" placeholder="What do you want to create?"
            class="w-full bg-transparent text-sm text-white placeholder-zinc-500 focus:outline-none resize-none leading-relaxed overflow-hidden px-2"></textarea>

          <div class="flex items-center justify-between pt-1">
            <div class="relative">
              <select id="model-select" class="appearance-none bg-[#1f1f23] text-zinc-200 text-xs rounded-xl px-3 py-1.5 pr-7 border border-zinc-800 focus:outline-none cursor-pointer">
                <option value="google/flow-video">Google Flow Video (Veo)</option>
              </select>
              <i data-lucide="chevron-down" class="w-3 h-3 absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none"></i>
            </div>

            <button id="generate-btn" class="w-8 h-8 rounded-full bg-white text-black hover:bg-zinc-200 transition flex items-center justify-center shrink-0">
              <i data-lucide="arrow-right" class="w-4 h-4 stroke-[2.5]"></i>
            </button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDdtiWw6gzYFqSyuq2-ufFzmJ1PZyL2bCE",
      authDomain: "flow-studio-a283b.firebaseapp.com",
      projectId: "flow-studio-a283b",
      storageBucket: "flow-studio-a283b.firebasestorage.app",
      messagingSenderId: "539719108009",
      appId: "1:539719108009:web:b5978cbb311019703d30b8",
      measurementId: "G-CT21P2M6XY"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function renderIcons() { if (window.lucide) lucide.createIcons(); }

    let currentSessionUser = null;

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const pass = document.getElementById('login-password').value;

      const snap = await db.collection('users').where('email', '==', email).get();
      if (snap.empty) return alert("Account not found!");

      let user = null;
      snap.forEach(d => user = { id: d.id, ...d.data() });

      if (user.password !== pass) return alert("Incorrect password!");

      currentSessionUser = user;
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('user-display-email').textContent = user.email;
      renderIcons();
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      currentSessionUser = null;
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
    });

    // Generate Task Submission
    const generateBtn = document.getElementById('generate-btn');
    const promptInput = document.getElementById('prompt-input');
    const dropzone = document.getElementById('dropzone');
    const resultView = document.getElementById('result-view');
    const outputBox = document.getElementById('output-box');
    const loadingSpinner = document.getElementById('loading-spinner');
    const outputVideo = document.getElementById('output-video');
    const downloadBtn = document.getElementById('download-btn');
    const statusText = document.getElementById('router-feedback-status');

    generateBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) return alert("Please enter a prompt!");

      dropzone.classList.add('hidden');
      resultView.classList.remove('hidden');
      loadingSpinner.classList.remove('hidden');
      outputVideo.classList.add('hidden');
      downloadBtn.classList.add('hidden');
      outputBox.classList.add('flow-glow-active');
      document.getElementById('output-prompt-text').textContent = `"${prompt}"`;
      generateBtn.disabled = true;

      statusText.textContent = "Queueing task to your dedicated Google account...";

      try {
        // Create Automation Task in Firestore
        const taskRef = await db.collection('video_tasks').add({
          userId: currentSessionUser.id,
          userEmail: currentSessionUser.email,
          prompt: prompt,
          model: document.getElementById('model-select').value,
          status: 'pending',
          stage: 'Queued for Worker...',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Real-time listener for this specific task
        const unsubscribe = taskRef.onSnapshot((doc) => {
          const task = doc.data();
          if (!task) return;

          if (task.status === 'processing') {
            statusText.textContent = task.stage || "Rendering video via Google Flow...";
          } else if (task.status === 'completed' && task.videoUrl) {
            outputBox.classList.remove('flow-glow-active');
            loadingSpinner.classList.add('hidden');
            outputVideo.src = task.videoUrl;
            outputVideo.classList.remove('hidden');
            outputVideo.play();

            downloadBtn.href = task.videoUrl;
            downloadBtn.classList.remove('hidden');
            downloadBtn.classList.add('flex');
            generateBtn.disabled = false;
            unsubscribe();
          } else if (task.status === 'failed') {
            outputBox.classList.remove('flow-glow-active');
            loadingSpinner.classList.add('hidden');
            alert(task.error || "Generation interrupted. Please try again.");
            generateBtn.disabled = false;
            unsubscribe();
          }
        });

      } catch (err) {
        alert("Failed to submit task: " + err.message);
        generateBtn.disabled = false;
      }
    });

    renderIcons();
  </script>
</body>
</html>
